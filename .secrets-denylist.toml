# Project-specific commit guard -- the SHAPES half. Public-safe by construction.
#
# Read scripts/check_denylist.py for why this exists next to gitleaks. Short
# version: gitleaks matches credential shapes and is good at it, but a Telegram
# chat/user/bot id is a bare integer and has no shape to match. That class has
# leaked into this public repository twice.
#
# The literal real values live in .secrets-denylist.local.toml, which is
# gitignored. They are NOT hashed into this file on purpose: a Telegram id is
# ten digits, so sha256 over a 10^10 space is brute-forced in seconds and a
# committed hash would publish exactly what it protects.
#
# Adding a rule: measure it over the tracked tree BEFORE committing it
# (`python3 scripts/check_denylist.py`). A rule that wrongly refuses is as real
# a defect as one that misses, and the bare-id shape is the cautionary tale --
# measured 2026-08-26 it produced 186 hits across the tree, essentially all of
# them placeholders. That is why bare ids are handled by literals, not here.
#
# Every rule needs an adversarial fixture in tests/unit/test_denylist_guard.py;
# the suite asserts that, so a rule with no test fails CI.

[[pattern]]
id = "telegram-chat-id"
# Supergroup/channel ids are -100 followed by ten digits -- a real shape, unlike
# a bare user id. Measured over the tracked tree: 20 raw hits, 5 after the
# synthetic filter, of which 4 were placeholders and one was a live test chat.
regex = '-100\d{10}'
why = "looks like a real Telegram supergroup/channel id"
skip_synthetic_ids = true
# This repository's own convention for invented chat ids. Keep writing new
# fixtures in this form and they will never trip the guard.
allow = ['-1009999\d{6}']
# Fixture files for the two commit guards: containing these shapes is their job.
# Scoped to this ONE rule and it does not cover literals, so a real id pasted
# into either file still fails the commit.
exempt_paths = [
  "tests/unit/test_denylist_guard.py",
  "tests/unit/test_plan_artifact_guard.py",
]

[[pattern]]
id = "home-path"
# An absolute developer path in committed code is always wrong, and it leaks the
# account name. The plan-artifact guard already catches these under docs/plans/;
# this extends the same rule to the rest of the tree.
regex = '/(?:Users|home)/[A-Za-z0-9._-]+/'
why = "absolute developer path (use a placeholder such as <projects>/)"
# Placeholder names the repository already uses in fixtures, plus GitHub
# Actions' fixed runner home -- identical on every runner, so it identifies
# nobody. Anything else under /Users/ or /home/ is a real account name.
allow = ['/(?:Users|home)/(?:someone|somebody|user|youruser|runner|<[a-z]+>)/']
exempt_paths = [
  "tests/unit/test_denylist_guard.py",
  "tests/unit/test_plan_artifact_guard.py",
]
