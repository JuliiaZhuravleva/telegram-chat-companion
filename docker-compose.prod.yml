# Production compose — deployed by an external harness onto a single-host Docker
# runtime (a Colima VM on macOS), running as a non-admin service user.
#
# STANDALONE — this is NOT an override layer over docker-compose.yml. Compose
# merges list-valued options (ports, volumes) by APPENDING, so a layered
# base + prod would keep the dev port publications instead of replacing them.
# The harness picks this file over docker-compose.yml automatically and always
# passes `-p companion`, so container names are companion-<service>-1.
#
# Differences from the dev compose, and why:
#   1. Postgres data lives on a HOST bind mount, not a named volume. The host's
#      colima autostart self-heals a power-loss-corrupted VM with `colima delete -f`,
#      which destroys named volumes. The bind-mount root is on the host's
#      journaled APFS and survives that.
#   2. Nothing is published to the host. The bot reaches Postgres over the compose
#      network; publishing 5432 would expose it on the host's network interfaces.
#   3. No container_name — it would escape the `-p companion` namespace.
#   4. Secrets come from .env, which the harness renders at deploy time from an
#      env map it keeps outside this repository, backed by a secrets manager.
#      Never commit a .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in the env map}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the env map}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in the env map}

    volumes:
      # HOST bind mount — survives `colima delete`. The harness refuses to deploy
      # a mount outside the project dir or its designated persistent-data root,
      # and COMPANION_DATA_DIR is exactly that root, supplied by its env map.
      # Parametrized rather than hardcoded because this repository is public and
      # a literal path here names a real directory on a real host. `:?` so a map
      # missing the variable fails at `compose config` with a readable message
      # instead of silently mounting `/postgres` at the filesystem root.
      - ${COMPANION_DATA_DIR:?Set COMPANION_DATA_DIR in the env map}/postgres:/var/lib/postgresql/data
      # Enables the pgvector extension on FIRST init only (initdb hook).
      - ./docker/init/01_init.sh:/docker-entrypoint-initdb.d/01_init.sh:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Memory ceiling only — deliberately NO cpu cap. Throttling a database's CPU
    # degrades latency for every query rather than bounding a burst, and Postgres
    # is not what competes for CPU here (the sticker path is). The cap exists so a
    # runaway query can't starve the shared VM.
    deploy:
      resources:
        limits:
          memory: 1g

  bot:
    build: .
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file: .env

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    healthcheck:
      test: ['CMD-SHELL', 'python -c "import time; t=float(open(\"/tmp/healthcheck\").read()); exit(0 if time.time()-t<600 else 1)"']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

    # The production VM has 4 CPUs and is SHARED with an unrelated co-tenant stack.
    # Sticker learning is the only genuinely CPU-bound path here: it shells out to
    # ffmpeg (motion.py) and renders .tgs through the blocking rlottie binding
    # (renderer.py). Neither bounds itself — ffmpeg is invoked without -threads, so
    # it sizes its thread pool to every CPU it can see, and rlottie runs via
    # asyncio.to_thread whose default executor is min(32, cpus+4) threads. A single
    # burst of new (uncached) stickers could therefore saturate the whole VM and
    # make the co-tenant stutter.
    #
    # This cgroup quota is the hard boundary: the kernel enforces it across every
    # process in the container, whatever spawned them. 1.5 of 4 CPUs leaves 2.5
    # guaranteed to the co-tenant. Sticker analysis gets slower under load, which is
    # the right trade — it's background enrichment, not a reply-latency path.
    #
    # Verified on the host before committing: Compose v5.3.0 under Colima does honour
    # these keys (they are not swarm-only here) — a probe container came back with
    # NanoCpus=1500000000 and Memory=536870912.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500m

  # Nightly encrypted database backup, uploaded off-host. See docs/backups.md.
  #
  # It is a container rather than a host crontab because the harness only knows
  # how to `docker compose up -d`: a crontab would live outside this repository
  # and outside the deploy, so it would silently stop tracking the code. As a
  # service it starts, restarts and reports health like everything else here.
  #
  # Does nothing at all until BACKUP_ENABLED=true is present in .env — an
  # unconfigured deploy idles quietly instead of crash-looping.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    # Same .env as the bot: the Postgres credentials, the age PUBLIC key and the
    # rclone remote (RCLONE_CONFIG_<NAME>_*) all arrive through the harness's
    # existing secret-rendering path. No rclone.conf is mounted — see the
    # Dockerfile for why the config is environment-only.
    env_file: .env

    environment:
      - PGHOST=postgres
      - PGPORT=5432

    volumes:
      # Sibling of the postgres data dir, under the same designated persistent
      # root, so backups survive a `colima delete` for exactly the same reason
      # the database does. Local copies are the fast restore path; the off-host
      # upload is what survives losing this machine.
      - ${COMPANION_DATA_DIR:?Set COMPANION_DATA_DIR in the env map}/backups:/backups

    # Reports unhealthy once no backup has succeeded in over a day, so a run of
    # silently failing nights is visible in `docker ps` and not only in logs.
    healthcheck:
      test: ["CMD", "/opt/companion/backup-healthcheck.sh"]
      interval: 15m
      timeout: 10s
      retries: 2
      start_period: 1m

    # A nightly burst on a VM shared with a co-tenant: capped so compression and
    # encryption cannot monopolise it. Backups taking longer costs nothing.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
