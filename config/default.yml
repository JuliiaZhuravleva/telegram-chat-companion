# Telegram Chat Companion - Default Configuration
# Override these settings in local.yml (gitignored) or via environment variables

# Bot behavior
bot:
  # Words that trigger the bot to respond (case-insensitive)
  trigger_words:
    - "bot"
    - "бот"

  # Chance to respond randomly to non-triggered messages (0.0 to 1.0)
  random_response_chance: 0.05

  # Minimum seconds between random responses in the same chat
  random_response_min_interval: 300

  # Relevancy gate: three-tier pre-check for random responses
  # Makes bot participation more natural by filtering out low-value responses
  relevancy_gate_enabled: true

# AI Provider Configuration (January 2026)
#
# COST POLICY: Always use the cheapest model that covers the task.
# Expensive models (gpt-5.2, gemini-3-pro, claude-opus, grok-4, o4-mini)
# require explicit approval — never set them as defaults.
ai:
  # Default provider for text generation
  default_provider: "gemini"

  # Task-specific provider configuration
  # All defaults use cheapest available models (nano/flash tier)
  tasks:
    text_generation:
      provider: "gemini"
      model: "gemini-3-flash-preview"      # cheap: flash tier
      fallback:
        - "openai"
      fallback_models:
        openai: "gpt-5-nano"               # cheapest OpenAI text model
      max_tokens: 500
      temperature: 0.9

    embeddings:
      provider: "gemini"
      model: "gemini-embedding-001"         # free/cheapest embedding model
      dimensions: 768
      # No fallback (S2-1, decided honestly-no-reserve over wiring one up):
      # OpenAI has no comparable 768-dim embedding model. text-embedding-3-small
      # supports a `dimensions` param, but truncating it changes the embedding
      # space -- vectors would not be comparable to the ones already stored in
      # chat_memory (vector(768), alembic/versions/003_rag_memory.py). A prior
      # `fallback: [openai]` here was never a working reserve: fallback_models
      # is parsed (src/config.py) but not read by the router, so a fallback
      # call reused Gemini's model name against OpenAI's API and always 404'd.
      # Revisit once a second 768-dim-native embedding provider exists. Until
      # then, a Gemini outage degrades honestly -- memory store/search skip
      # with a warning (src/services/rag/memory.py) instead of a fallback call
      # that was guaranteed to fail.

    vision:
      provider: "gemini"
      model: "gemini-3-flash-preview"       # cheap: flash tier
      fallback:
        - "openai"
      fallback_models:
        openai: "gpt-5-nano"               # nano has multimodal, no need for gpt-5.2
      max_tokens: 200

    # relevancy_check task removed (S2-9, TD-058): AIRouter.generate_text() has no
    # per-task routing parameter, so this section was never read -- provider,
    # max_tokens and temperature here were all ignored. llm_judge.py addresses
    # OpenAI directly via an explicit model="gpt-5-nano" override (the documented
    # provider-addressing idiom, CLAUDE.md "Critical Patterns") and passes its own
    # max_tokens=4096/temperature=1.0. Re-add once generate_text() gains real
    # per-task routing (TD-058) -- until then a key here is a knob that does
    # nothing.

    transcription:
      provider: "openai"
      model: "whisper-1"
      # No fallback - only OpenAI supports this

# RAG Memory Configuration
rag:
  # Minimum similarity score for relevant memories (0.0 to 1.0)
  min_similarity: 0.7

  # Maximum memories to retrieve per query
  max_results: 5

  # Memory importance scoring
  default_importance: 0.5

# Data retention for the periodic cleanup task.
# Set any window to null to never delete that table.
maintenance:
  enabled: true
  interval_seconds: 3600

  # Ephemeral — only feeds spam/velocity windows.
  user_activity_hours: 1

  # Longer than the reference n8n bot's 30 days on purpose: the migration
  # carries ~36k historical messages over and they must survive the first pass.
  chat_messages_days: 365

  # Backs /costs analytics, so kept longer than a debug log would be.
  response_log_days: 90

  # null on purpose — this table is state, not a log. has_rejected_attempt()
  # queries it with no time bound and the access middleware short-circuits on
  # the answer, so a rejected row IS the ban record; ageing it out silently
  # un-bans the chat. The live migration carried 147 rows for ~6 months, so
  # there is nothing to reclaim here anyway.
  unauthorized_attempts_days: null

  abuse_blocked_log_days: 30

  # Short, separate window (ADR-0004): message_reactions is a behavioral
  # trail ("who reacted to what"), more sensitive than message text, so it
  # does not reuse chat_messages_days or response_log_days.
  reactions_days: 30

  # Observability logs (migration 022): decision_log records respond/silence
  # decisions, retrieval_log records what RAG/KB returned per turn. Same
  # window as response_log — operational analytics, not history.
  decision_log_days: 90
  retrieval_log_days: 90

# Module Configuration
# Set enabled: false to disable a module entirely
modules:
  # Core modules (always enabled)
  text_responses:
    enabled: true

  rag_memory:
    enabled: true

  # Optional modules
  voice_transcription:
    enabled: true
    requires:
      - "transcription"

  sticker_intelligence:
    enabled: false  # Disabled by default (requires vision + embeddings)
    requires:
      - "vision"
      - "embeddings"
    response_chance: 0.15
    reply_to_sticker_enabled: true
    reply_to_sticker_chance: 0.5
    image_comment_sticker_enabled: true
    image_comment_sticker_chance: 0.3
    # Debug mode: save Vision API artifacts (prompt, response, collage image).
    # Enable for troubleshooting only (YAML-only setting, not controllable via DB).
    debug_mode: false
    debug_retention_days: 7

  image_analysis:
    enabled: true
    requires:
      - "vision"

  abuse_filter:
    enabled: false  # Disabled by default
    requires:
      - "embeddings"

  rules_engine:
    enabled: false

  link_comments:
    enabled: false

  knowledge_base:
    enabled: false  # Disabled by default (opt-in per chat, ADR-0003)
    requires:
      - "embeddings"

  reactions:
    enabled: false  # Disabled by default (opt-in per chat, ADR-0004)

  admin_panel:
    enabled: true

# Logging
logging:
  level: "INFO"
  format: "json"  # "json" or "console"
