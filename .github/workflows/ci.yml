name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PINNED, for the same reason gitleaks is pinned in .pre-commit-config.yaml:
      # bump deliberately, don't float. Unpinned, this gate changed under us with
      # no repository change — a newer ruff began formatting Python blocks inside
      # Markdown, so CI saw 213 files where a developer's 0.15.0 saw 199, and the
      # job failed on ADR documents nobody had touched.
      - run: pip install ruff==0.15.0
      # Whole repo, not just src/ tests/ — the gap was alembic/, which is the
      # code that runs on every deploy and where this project has already had a
      # production blocker. Two lint errors had sat in alembic/env.py since the
      # first commit, invisible because CI never looked there. ruff honours
      # .gitignore, so this stays limited to tracked files.
      - run: ruff check .
      - run: ruff format --check .
      # uv.lock is committed for contributors who use uv, but NOTHING else in
      # this project consumes it: the Dockerfile and the jobs below install with
      # pip. An unchecked lockfile is therefore the worst of both worlds — it
      # looks like reproducibility while quietly drifting from pyproject.toml,
      # and `uv sync` then builds an environment nobody has tested. This step is
      # what makes committing it honest. Pinned like ruff above: an unpinned
      # resolver is a gate that changes with no repository change.
      - run: pip install uv==0.12.2
      - run: uv lock --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: "test-token-000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
