name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Whole repo, not just src/ tests/ — the gap was alembic/, which is the
      # code that runs on every deploy and where this project has already had a
      # production blocker. Two lint errors had sat in alembic/env.py since the
      # first commit, invisible because CI never looked there. ruff honours
      # .gitignore, so this stays limited to tracked files.
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: "test-token-000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
