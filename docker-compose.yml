# Dev stack. Pinned so the project name does not follow the directory: a plain
# `docker compose up` from a git worktree would otherwise start a SECOND project
# with its own empty database volume, and two repos that both keep a compose
# file in a same-named folder would collapse into one project, where `up -d` in
# either deletes the other's containers.
#
# This is the local name already in use — pinning it changes nothing today.
# Production uses `companion`; see docker-compose.prod.yml.
name: telegram-chat-companion

# Bounded container logs. Without this Docker's json-file driver grows without
# limit; with it, ~50MB of recent stdout survives per service for debugging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: companion-postgres
    restart: unless-stopped
    logging: *default-logging

    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bot_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-telegram_bot}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init/01_init.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
      # Schema is applied by the bot container via `alembic upgrade head`
      # (see Dockerfile CMD) — no SQL file is mounted here.

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-bot_user} -d ${POSTGRES_DB:-telegram_bot}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Telegram Chat Companion bot
  bot:
    build: .
    container_name: companion-bot
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      postgres:
        condition: service_healthy

    env_file: .env

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bot_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telegram_bot}

    healthcheck:
      test: ['CMD-SHELL', 'python -c "import time; t=float(open(\"/tmp/healthcheck\").read()); exit(0 if time.time()-t<600 else 1)"']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Database backup — OPT-IN here, unlike production where it always runs.
  # Dev data is disposable and nobody wants their laptop pushing dumps to a
  # cloud drive by surprise, so this service only starts when asked:
  #
  #   docker compose --profile backup up -d backup      # start the nightly loop
  #   docker compose --profile backup run --rm backup \
  #       /opt/companion/backup-db.sh --no-upload       # one local backup, now
  #
  # Handy for rehearsing a restore against a copy of production. See docs/backups.md.
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      postgres:
        condition: service_healthy

    env_file: .env

    environment:
      - PGHOST=postgres
      - PGPORT=5432

    volumes:
      - ./backups:/backups

    healthcheck:
      test: ["CMD", "/opt/companion/backup-healthcheck.sh"]
      interval: 15m
      timeout: 10s
      retries: 2
      start_period: 1m

volumes:
  postgres-data:
