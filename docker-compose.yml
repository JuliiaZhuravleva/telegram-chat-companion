services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: companion-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bot_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-telegram_bot}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init/01_init.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-bot_user} -d ${POSTGRES_DB:-telegram_bot}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Telegram Chat Companion bot
  bot:
    build: .
    container_name: companion-bot
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file: .env

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bot_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telegram_bot}

volumes:
  postgres-data:
